spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
app:
  base-url: ${APP_BASE_URL}
  mail-mode: smtp
  mail-from: ${MAIL_FROM}
  seed-default: false
